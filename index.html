    <title>Outreach</title>
    <script>
      try { var th = localStorage.getItem("outreach-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
      try { var mo = localStorage.getItem("outreach-motion"); if (mo === "on" || mo === "off") document.documentElement.setAttribute("data-motion", mo); } catch (e) {}
      try { if (localStorage.getItem("outreach-density") === "compact") document.documentElement.setAttribute("data-density", "compact"); } catch (e) {}
      try {
        var av = JSON.parse(localStorage.getItem("outreach-accent-vars") || "null");
        var dk = th === "dark" || (th !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        var set = av && (dk ? av.dark : av.light);
        if (set) for (var k in set) document.documentElement.style.setProperty(k, set[k]);
      } catch (e) {}
    </script>
